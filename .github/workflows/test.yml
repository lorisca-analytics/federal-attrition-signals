name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no network, synthetic files)
        run: python -m pytest -q
      - name: Committed tables still match the data contract
        run: python -m fas.contract data/clean
      - name: Dashboard data matches the clean tables
        run: |
          for f in data/clean/*.csv; do cmp "$f" "dashboard/data/$(basename "$f")"; done
